# Fleet: copy of mcp-central-docs/templates/pre-commit-config.yaml.template (ruff subset).
# No TS in this repo (web_sota/ is static HTML), so no Biome hook.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
